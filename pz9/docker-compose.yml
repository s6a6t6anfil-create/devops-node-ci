services:
  app:
    build: .
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/nodeapp:${IMAGE_TAG:?Set IMAGE_TAG}"
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER:-nodeapp}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB:-nodeapp}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    mem_limit: 256m
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-nodeapp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-nodeapp}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
volumes:
  postgres_data:
